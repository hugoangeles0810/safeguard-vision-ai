# Default configuration for fall detection training

# Data settings
data:
  data_path: "data/processed"
  sequence_length: 60  # Number of frames (2 seconds @ 30fps)
  num_keypoints: 17  # COCO format (YOLOv8) or 33 (MediaPipe)
  pose_format: "coco"  # "coco" or "mediapipe"
  batch_size: 32
  num_workers: 4
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

# Model settings
model:
  type: "lstm"  # "lstm" or "transformer"
  input_dim: 34  # num_keypoints * 2 (x, y coordinates)

# Training settings
training:
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"  # "adam" or "adamw"
  scheduler: "reduce_on_plateau"  # "reduce_on_plateau" or "cosine"
  scheduler_patience: 10
  scheduler_factor: 0.5
  early_stopping_patience: 15
  gradient_clip: 1.0

# Loss settings
loss:
  type: "weighted_bce"  # "bce", "weighted_bce", "focal"
  pos_weight: 2.0  # Weight for positive class (falls are rarer)

# Augmentation settings
augmentation:
  enabled: true
  temporal_jitter: 0.1
  speed_variation: [0.8, 1.2]
  horizontal_flip_prob: 0.5
  noise_std: 0.01
  keypoint_dropout_prob: 0.1

# Preprocessing settings
preprocessing:
  normalize: true
  normalization_method: "torso_height"  # "torso_height", "bbox", "none"
  add_velocities: false
  add_accelerations: false

# Paths
paths:
  checkpoint_dir: "results/checkpoints"
  log_dir: "results/logs"
  figure_dir: "results/figures"

# Device settings
device: "cuda"  # "cuda" or "cpu"
seed: 42

# Evaluation settings
evaluation:
  threshold: 0.5  # Classification threshold
  save_predictions: true
  save_confusion_matrix: true
